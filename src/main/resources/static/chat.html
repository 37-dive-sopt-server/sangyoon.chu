<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebSocket 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            font-size: 14px;
        }
        input {
            width: 300px;
        }
        button {
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
        }
        button:hover {
            background-color: #45a049;
        }
        #messages {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: scroll;
            padding: 10px;
            background-color: #f9f9f9;
            margin-top: 10px;
        }
        .message {
            margin: 5px 0;
            padding: 5px;
        }
        .enter { color: green; }
        .leave { color: red; }
        .system { color: #666; font-style: italic; }
        .sender { font-weight: bold; }
        .connected {
            color: green;
            font-weight: bold;
        }
        .disconnected {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
<h1>🔧 WebSocket 테스트</h1>

<!-- 토큰 입력 -->
<div class="section">
    <h3>1. JWT 토큰 입력</h3>
    <input type="text" id="tokenInput" placeholder="Bearer eyJhbGc..." />
    <button onclick="saveToken()">토큰 저장</button>
    <p id="tokenStatus"></p>
</div>

<!-- WebSocket 연결 -->
<div class="section">
    <h3>2. WebSocket 연결</h3>
    <button onclick="connect()">연결</button>
    <button onclick="disconnect()">연결 끊기</button>
    <p>상태: <span id="connectionStatus" class="disconnected">연결 안 됨</span></p>
</div>

<!-- 메시지 -->
<div class="section">
    <h3>3. 메시지</h3>
    <div id="messages"></div>
    <input type="text" id="messageInput" placeholder="메시지 입력..." />
    <button onclick="sendMessage()">전송</button>
</div>

<script>
    let socket;
    let token;

    // 토큰 저장
    function saveToken() {
        const input = document.getElementById('tokenInput').value.trim();

        if (input) {
            // "Bearer " 제거 (있으면)
            token = input.replace('Bearer ', '').trim();
            localStorage.setItem('chatToken', token);
            document.getElementById('tokenStatus').textContent = '✅ 토큰 저장됨';
            document.getElementById('tokenStatus').style.color = 'green';
        } else {
            document.getElementById('tokenStatus').textContent = '❌ 토큰을 입력하세요';
            document.getElementById('tokenStatus').style.color = 'red';
        }
    }

    // 페이지 로드 시 저장된 토큰 불러오기
    window.onload = function() {
        token = localStorage.getItem('chatToken');
        if (token) {
            document.getElementById('tokenInput').value = token;
            document.getElementById('tokenStatus').textContent = '✅ 저장된 토큰 로드됨';
            document.getElementById('tokenStatus').style.color = 'green';
        }
    };

    // WebSocket 연결
    function connect() {
        if (!token) {
            alert('토큰을 먼저 저장하세요!');
            return;
        }

        if (socket && socket.readyState === WebSocket.OPEN) {
            alert('이미 연결되어 있습니다!');
            return;
        }

        // WebSocket 연결 (쿼리 파라미터로 토큰 전달)
        const url = 'ws://localhost:8080/ws/chat?token=' + token;
        socket = new WebSocket(url);

        socket.onopen = function() {
            updateConnectionStatus(true);
            addSystemMessage('✅ 연결되었습니다.');
        };

        socket.onmessage = function(event) {
            const message = JSON.parse(event.data);
            displayMessage(message);
        };

        socket.onclose = function() {
            updateConnectionStatus(false);
            addSystemMessage('❌ 연결이 끊어졌습니다.');
        };

        socket.onerror = function(error) {
            updateConnectionStatus(false);
            addSystemMessage('⚠️ 에러: ' + error);
            alert('연결 실패! 토큰을 확인하세요.');
        };
    }

    // 연결 끊기
    function disconnect() {
        if (socket) {
            socket.close();
        }
    }

    // 메시지 전송
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();

        if (!content) {
            alert('메시지를 입력하세요!');
            return;
        }

        if (!socket || socket.readyState !== WebSocket.OPEN) {
            alert('먼저 연결하세요!');
            return;
        }

        const message = {
            type: 'CHAT',
            content: content
        };

        socket.send(JSON.stringify(message));
        input.value = '';
    }

    // 메시지 표시
    function displayMessage(message) {
        const messagesDiv = document.getElementById('messages');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message ' + message.type.toLowerCase();

        const timestamp = new Date(message.timestamp).toLocaleTimeString();

        if (message.type === 'CHAT') {
            messageDiv.innerHTML =
                `<span class="sender">${message.sender}:</span> ` +
                `${message.content} ` +
                `<span style="color: #999; font-size: 0.8em;">${timestamp}</span>`;
        } else {
            messageDiv.innerHTML =
                `${message.content} ` +
                `<span style="color: #999; font-size: 0.8em;">${timestamp}</span>`;
        }

        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // 시스템 메시지
    function addSystemMessage(text) {
        const messagesDiv = document.getElementById('messages');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message system';
        messageDiv.textContent = text + ' (' + new Date().toLocaleTimeString() + ')';
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // 연결 상태 업데이트
    function updateConnectionStatus(connected) {
        const statusElement = document.getElementById('connectionStatus');
        if (connected) {
            statusElement.textContent = '연결됨';
            statusElement.className = 'connected';
        } else {
            statusElement.textContent = '연결 안 됨';
            statusElement.className = 'disconnected';
        }
    }

    // Enter 키 이벤트
    document.getElementById('messageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>
</body>
</html>
